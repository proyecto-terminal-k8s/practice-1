apiVersion: apps/v1
kind: Deployment
metadata:
  name: calculadora-frontend
  namespace: practice-1
  labels:
    app.kubernetes.io/name: calculadora-frontend
  annotations:
    kubernetes.io/change-cause: "versión inicial: calculadora-frontend v2"
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: calculadora-frontend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: calculadora-frontend
    spec:
      containers:
        - name: frontend
          image: your-registry/calculadora-frontend:v2
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          env:
            - name: API_HOST
              value: calculadora-backend.practice-1.svc.cluster.local
            - name: API_PORT
              value: "8080"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
